# ──────────────────────────────────────────────────────────────────────────────
# Comply.dev — Automated Compliance Scan
#
# Runs on a weekly schedule AND can be triggered manually from the Actions tab.
# Results are committed as reports/latest.json on the `reports-data` branch
# so the Streamlit dashboard can always fetch the freshest data.
#
# REQUIRED SECRETS (GitHub repo → Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID       — IAM user access key ID
#   AWS_SECRET_ACCESS_KEY   — IAM user secret access key
#   AWS_DEFAULT_REGION      — e.g. us-east-1
#   COMPLY_GITHUB_TOKEN     — Personal Access Token (repo or public_repo scope)
#   GITHUB_REPOS            — comma-separated owner/repo values to scan
# ──────────────────────────────────────────────────────────────────────────────
name: Compliance Scan

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scan:
    name: Run compliance scan
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full compliance scan
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_DEFAULT_REGION }}
          GITHUB_TOKEN:          ${{ secrets.GH_TOKEN }}
          GITHUB_REPOS:          ${{ secrets.GH_REPOS }}
        run: |
          mkdir -p reports
          echo "--- Running scan ---"
          python main.py scan
          echo "--- Files in reports/ ---"
          ls -la reports/

      - name: Normalize report filename to latest.json
        run: |
          LATEST=$(ls -t reports/comply_report_*.json 2>/dev/null | head -1)

          if [ -z "$LATEST" ]; then
            echo "No report file found — scan may have failed."
            exit 1
          fi

          # ✅ Move newest report to latest.json
          cp "$LATEST" reports/latest.json

      - name: Publish report to reports-data branch
        run: |
          git config user.name  "comply-bot"
          git config user.email "comply-bot@users.noreply.github.com"

          cp reports/latest.json /tmp/latest.json

          # ✅ Fetch and switch to reports branch
          git fetch origin reports-data || true
          git checkout -B reports-data origin/reports-data || git checkout --orphan reports-data

          # ✅ Clean workspace
          git rm -rf . --quiet || true
          git clean -fd || true

          mkdir -p reports

          # ✅ COPY previous.json FIRST (if exists)
          if [ -f reports/latest.json ]; then
            cp reports/latest.json reports/previous.json
          fi

          # ✅ Move new report in
          cp /tmp/latest.json reports/latest.json

          git add reports/latest.json || true
          git add reports/previous.json || true

          git diff --staged --quiet || \
            git commit -m "chore: compliance scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          git push origin reports-data --force
