name: Comply.dev Scheduled Scan

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compliance-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run compliance scan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          GITHUB_TOKEN: ${{ secrets.GH_SCAN_TOKEN }}
          GITHUB_REPOS: ${{ secrets.GITHUB_REPOS }}
        run: |
          python main.py scan --output-dir reports

      - name: Commit reports to repo
        run: |
          git config user.name "comply-dev-bot"
          git config user.email "bot@comply.dev"
          git add reports/
          git diff --staged --quiet || git commit -m "🛡️ Auto-update: compliance scan $(date +%Y-%m-%d)"
          git push

      - name: Upload reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: compliance-reports
          path: reports/
          retention-days: 30

      - name: Check for critical findings
        run: |
          python -c "
          import json, glob, sys
          reports = sorted(glob.glob('reports/*.json'), reverse=True)
          if reports:
              data = json.load(open(reports[0]))
              criticals = sum(1 for f in data['findings'] if f.get('severity') == 'CRITICAL' and f.get('status') == 'FAIL')
              if criticals > 0:
                  print(f'::error::{criticals} CRITICAL findings detected!')
                  sys.exit(1)
              else:
                  print('No critical findings.')
          "
